<svg width="1200" height="4" viewBox="0 0 1200 4" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .shine { animation: move 4s linear infinite; }
      @keyframes move { 0% { transform: translateX(-360px); } 100% { transform: translateX(1200px); } }
    </style>
  </defs>
  <rect width="1200" height="4" fill="url(#g)"/>
  <rect class="shine" width="260" height="4" fill="url(#shine)" opacity="0.45"/>
</svg>
