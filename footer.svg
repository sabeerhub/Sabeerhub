<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mustapha Abdulsalam — Sabeer-Verse — Building the future">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="50%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <style>
      .wave { animation: drift 11s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-34px); } }
    </style>
  </defs>
  <rect width="1200" height="150" fill="#000000"/>
  <path class="wave" d="M0,88 C200,40 400,132 600,88 C800,40 1000,132 1200,88 L1200,150 L0,150 Z" fill="url(#fg)" opacity="0.35"/>
  <text x="600" y="66" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">Mustapha Abdulsalam</text>
  <text x="600" y="92" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#00BFFF">SABEER-VERSE · BUILDING THE FUTURE</text>
</svg>
