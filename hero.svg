<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mustapha Abdulsalam — Sabeer — Founder of Sabeer-Verse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00BFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00BFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00BFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="80" y="66" width="1040" height="288" rx="24"/>
    </clipPath>
    <style>
      .blobA { animation: floatA 13s ease-in-out infinite; }
      .blobB { animation: floatB 15s ease-in-out infinite; }
      @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(36px,-18px); } }
      @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-28px,22px); } }
      .sheen { animation: sweep 7s linear infinite; }
      @keyframes sweep { 0% { transform: translateX(-260px) skewX(-18deg); } 100% { transform: translateX(1260px) skewX(-18deg); } }
      .role { opacity: 0; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; animation: cycle 18s ease-in-out infinite; }
      .role1 { animation-delay: 0s; } .role2 { animation-delay: 3s; } .role3 { animation-delay: 6s; }
      .role4 { animation-delay: 9s; } .role5 { animation-delay: 12s; } .role6 { animation-delay: 15s; }
      @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 14% { opacity: 1; } 18% { opacity: 0; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle class="blobA" cx="200" cy="110" r="220" fill="url(#blob1)" filter="url(#blur)"/>
  <circle class="blobB" cx="1000" cy="310" r="260" fill="url(#blob2)" filter="url(#blur)"/>

  <rect x="80" y="66" width="1040" height="288" rx="24" fill="#FFFFFF" fill-opacity="0.03" stroke="url(#panelStroke)" stroke-width="1.2"/>
  <g clip-path="url(#panelClip)">
    <rect class="sheen" x="-260" y="60" width="220" height="300" fill="url(#sheen)"/>
  </g>

  <text x="600" y="178" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Mustapha Abdulsalam</text>
  <text x="600" y="212" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#00BFFF">SABEER · FOUNDER OF SABEER-VERSE</text>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#FFFFFF" text-anchor="middle">
    <text class="role role1" x="600" y="276">Frontend Engineer</text>
    <text class="role role2" x="600" y="276">AI Builder</text>
    <text class="role role3" x="600" y="276">Web3 Developer</text>
    <text class="role role4" x="600" y="276">Prompt Engineer</text>
    <text class="role role5" x="600" y="276">Building AI-Powered Products</text>
    <text class="role role6" x="600" y="276">Building the Future</text>
  </g>

  <text x="600" y="322" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" letter-spacing="1.5">JIGAWA STATE, NIGERIA</text>
</svg>
